services:

  # -----------------------------------------------
  # NestJS application
  # -----------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3000

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be defined in .env}

      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:?Set MongoDB username}:${MONGO_INITDB_ROOT_PASSWORD:?Set MongoDB password}@mongo:27017/taskly?authSource=admin"

    ports:
      - "${APP_PORT:-3000}:3000"

    depends_on:
      mongo:
        condition: service_healthy


  # -----------------------------------------------
  # MongoDB database
  # -----------------------------------------------
  mongo:
    image: mongo:8.0

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db

    # Optional: expose MongoDB for MongoDB Compass.
    # Keep it bound to localhost.
    ports:
      - "127.0.0.1:27017:27017"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


# -----------------------------------------------
# Persistent database storage
# -----------------------------------------------
volumes:
  mongo_data:
